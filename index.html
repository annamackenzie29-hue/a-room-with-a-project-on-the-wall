
<!DOCTYPE html>
<html>
<head>
  <title>A room with a project on the wall</title>

  <style>
    body {
      font-family: monospace;
      margin: 20px;
      color: black;
      background: white;
      font-size: 20px;
      text-align: center;
    }

    h1 {
      font-size: 45px;
      font-weight: normal;
    }

    .tab {
      /*border-bottom: 1px solid #ccc; */
      margin-bottom: 30px;
    }

    .tab button {
      font-family: monospace;
      font-size: 35px;
      background: none;
      border: none;
      padding: 10px 10px 10px 0;
      margin-right: 20px;
      cursor: pointer;
      color: black;
      -webkit-tap-highlight-color: transparent;
    }

    .tab button.active {
      background-color: #ddd;
    }

    .tabcontent {
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>A room with a project on the wall</h1>

  <div class="tab">
    <button class="tablinks" onclick="openTab(event, 'wearable')" id="defaultOpen">
      wearable_camera_system
    </button>

    <button class="tablinks" onclick="openTab(event, 'plinth')">
      recursive_plinth
    </button>
  </div>

  <div id="wearable" class="tabcontent">

  </div>

  <div id="plinth" class="tabcontent">

  </div>

  <script>

    async function openTab(event, tabName) {
    var tabs = document.getElementsByClassName("tabcontent");
    var buttons = document.getElementsByClassName("tablinks");

    for (var i = 0; i < tabs.length; i++) {
        tabs[i].style.display = "none";
    }

    for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
    }

    var content = document.getElementById(tabName);
    content.style.display = "block";
    event.currentTarget.classList.add("active");

    var file;

    if (tabName === "wearable") {
        file = "wearable_camera_system.txt";
    } else {
        file = "recursive_plinth.txt";
    }

    try {
        var response = await fetch(file + "?t=" + Date.now());

        if (!response.ok) {
        throw new Error("Could not load file");
        }

        content.textContent = await response.text();
    } catch (error) {
        content.textContent = "Could not load text.";
    }
    }

    document.getElementById("defaultOpen").click();

  </script>

</body>
</html>
