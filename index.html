
<!DOCTYPE html>
<html>
<head>
  <title>a room with a project on the wall</title>

  <style>
    body {
      font-family: monospace;
      margin: 20px;
      color: black;
      background: white;
      font-size: 20px;
      text-align: center;
    }

    h1 {
      font-size: 45px;
      font-weight: normal;
      text-align: center;
    }

    h2 {
      font-size: 35px;
      font-weight: normal;
      text-align: center;
    }

    .tab {
      margin-bottom: 30px;
      text-align: center;
    }

    .tab button {
      font-family: monospace;
      font-size: 25px;
      background: none;
      border: none;
      padding: 10px;
      margin: 0 10px;
      cursor: pointer;
      color: black;
      -webkit-tap-highlight-color: transparent;
    }

    .tab button.active {
      border: 2px solid black;
    }

    .tabcontent {
      display: none;
      white-space: pre-wrap;
      text-align: center;
    }

    #last-updated {
      font-size: 14px;
      margin-bottom: 25px;
    }

    #captions {
      text-align: center;
    }

    .tabcontent img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>

<body>

  <h1>A ROOM WITH A PROJECT ON THE WALL</h1>

  <div class="tab">
    <button class="tablinks" onclick="openTab(event, 'wearable')" id="defaultOpen">
      wearable_camera_system
    </button>

    <button class="tablinks" onclick="openTab(event, 'plinth')">
      recursive_plinth
    </button>
  </div>

  <div id="wearable" class="tabcontent">
    <h2>an image of a poem in the language of a poem</h2>
    <p id="last-updated">Last updated: loading...</p>
    <div id="captions"></div>
  </div>

  <div id="plinth" class="tabcontent">
    <img src="Receipt_Merged.png" alt="Output of Plinth">
  </div>

  <script>
    async function openTab(event, tabName) {
      var tabs = document.getElementsByClassName("tabcontent");
      var buttons = document.getElementsByClassName("tablinks");

      for (var i = 0; i < tabs.length; i++) {
        tabs[i].style.display = "none";
      }

      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
      }

      var content = document.getElementById(tabName);
      content.style.display = "block";
      event.currentTarget.classList.add("active");
      history.pushState(null, "", "#" + tabName);

      if (tabName === "wearable") {
        var timeResponse = await fetch(
          "https://raw.githubusercontent.com/annamackenzie29-hue/wearable_data/main/last_updated.txt?t=" + Date.now()
        );
        document.getElementById("last-updated").textContent =
          "Last updated: " + await timeResponse.text();

        var captionResponse = await fetch(
          "https://raw.githubusercontent.com/annamackenzie29-hue/wearable_data/main/output.txt?t=" + Date.now()
        );
        document.getElementById("captions").textContent =
          await captionResponse.text();
      }
    }

    var tab = location.hash === "#plinth" ? "plinth" : "wearable";
    document.querySelector('[onclick*="' + tab + '"]').click();
  </script>

</body>
</html>
