
<!DOCTYPE html>
<html>
<head>
  <title>A room with a project on the wall</title>

  <style>
    body {
      font-family: monospace;
      margin: 20px;
      color: black;
      background: white;
      font-size: 20px;
      text-align: center;
    }

    h1 {
      font-size: 45px;
      font-weight: normal;
    }

    .tab {
      /*border-bottom: 1px solid #ccc; */
      margin-bottom: 30px;
    }

    .tab button {
      font-family: monospace;
      font-size: 35px;
      background: none;
      border: none;
      padding: 10px 10px 10px 0;
      margin-right: 20px;
      cursor: pointer;
      color: black;
      -webkit-tap-highlight-color: transparent;
    }

    .tab button.active {
     /* background-color: #ddd; */
      border: 2px solid black;
      padding: 10px;
    }

    .tabcontent {
      display: none;
      white-space: pre-wrap;
    }

    .tabcontent img {
      width: 100vw;
      max-width: none;
      height: auto;
      display: block;
    }
  </style>
</head>

<body>

  <h1>A room with a project on the wall</h1>

  <div class="tab">
    <button class="tablinks" onclick="openTab(event, 'wearable')" id="defaultOpen">
      wearable_camera_system
    </button>

    <button class="tablinks" onclick="openTab(event, 'plinth')">
      recursive_plinth
    </button>
  </div>

  <div id="wearable" class="tabcontent">

  </div>

  <div id="plinth" class="tabcontent">
    <img src="Receipt_Merged.png" alt="Output of Plinth">
  </div>

  <script>

    async function openTab(event, tabName) {
      var tabs = document.getElementsByClassName("tabcontent");
      var buttons = document.getElementsByClassName("tablinks");
    
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].style.display = "none";
      }
    
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
      }
    
      var content = document.getElementById(tabName);
      content.style.display = "block";
      event.currentTarget.classList.add("active");
      history.pushState(null, "", "#" + tabName);
    
      if (tabName === "wearable") {
        var response = await fetch("wearable_camera_system.txt");
        content.textContent = await response.text();
      }
    }
    
    var tab = location.hash === "#plinth" ? "plinth" : "wearable";
    document.querySelector('[onclick*="' + tab + '"]').click();

  </script>

</body>
</html>
