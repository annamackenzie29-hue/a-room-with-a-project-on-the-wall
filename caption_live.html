
<!DOCTYPE html>
<html>
<head>
  <title>a room with a project on the wall</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: monospace;
      margin: 0;
      color: black;
      background: white;
      font-size: 16px;
    }

    /* Top banner */
    .banner {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #e5e5e5;
      padding: 14px 16px;
      width: 100%;
      box-sizing: border-box;
    }

    .back-arrow {
      color: black;
      text-decoration: none;
      font-size: 26px;
      line-height: 1;
      flex-shrink: 0;
    }

    .banner-title {
      color: black;
      text-decoration: none;
      font-size: 14px;
      font-weight: normal;
    }

    /* Main content */
    .content {
      padding: 0 16px 30px;
    }

    h1 {
      font-size: 26px;
      font-weight: normal;
      text-align: center;
      margin: 30px 0 12px;
    }

    h2 {
      font-size: 13px;
      font-weight: normal;
      text-align: center;
      line-height: 1.5;
      margin: 0 0 32px;
    }

    /* Captions */
    .caption-column {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    #last-updated {
      font-size: 12px;
      text-align: left;
      margin: 0 0 14px;
    }

    #captions {
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-align: left;
      margin: 0;
      padding: 12px;
      border: 1px solid;
      box-sizing: border-box;
      width: 100%;
    }
  </style>
</head>

<body>

  <header class="banner">
    <a href="index.html" class="back-arrow" aria-label="Back to home">←</a>

    <a href="index.html" class="banner-title">
      A ROOM WITH A PROJECT ON THE WALL
    </a>
  </header>

  <main class="content">

    <h1>CAPTIONS_LIVE</h1>

    <h2>(an image of a poem in the language of a poem)</h2>

    <div class="caption-column">
      <p id="last-updated">Last updated: loading...</p>
      <div id="captions"></div>
    </div>

  </main>

  <script>
    const url =
      "https://raw.githubusercontent.com/annamackenzie29-hue/wearable_data/main/";

    async function updateCaptions() {
      try {
        const timeResponse = await fetch(
          url + "last_updated.txt?t=" + Date.now()
        );

        if (!timeResponse.ok) {
          throw new Error("Could not load timestamp");
        }

        const time = await timeResponse.text();
        const updated = document.getElementById("last-updated");

        if (time.trim() === updated.dataset.time) {
          return;
        }

        const captionsResponse = await fetch(
          url + "output.txt?t=" + Date.now()
        );

        if (!captionsResponse.ok) {
          throw new Error("Could not load captions");
        }

        const captions = await captionsResponse.text();

        document.getElementById("captions").textContent = captions;
        updated.textContent = "Last updated: " + time.trim();
        updated.dataset.time = time.trim();

      } catch (error) {
        console.error("Error updating captions:", error);
      }
    }

    updateCaptions();
    setInterval(updateCaptions, 60000);
  </script>

</body>
</html>
