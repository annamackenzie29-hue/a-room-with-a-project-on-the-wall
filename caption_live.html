
<!DOCTYPE html>
<html>
<head>
  <title>a room with a project on the wall</title>

  <style>
    body {
      font-family: monospace;
      margin: 0;
      color: black;
      background: white;
      font-size: 20px;
      text-align: center;
    }

    /* Top banner */
    .banner {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #e5e5e5;
      padding: 18px 25px;
      width: 100%;
      box-sizing: border-box;
    }

    .back-arrow {
      color: black;
      text-decoration: none;
      font-size: 32px;
      line-height: 1;
      flex-shrink: 0;
    }

    .banner-title {
      color: black;
      text-decoration: none;
      font-size: 22px;
      font-weight: normal;
    }

    /* Page content */
    .content {
      margin: 20px;
    }

    h1 {
      font-size: 50px;
      font-weight: normal;
      text-align: center;
      font-family: monospace;
      margin-top: 45px;    /* Space above */
      margin-bottom: 20px;    /* Space above */
      
    }

    h2 {
      font-size: 30px;
      font-weight: normal;   
      margin-bottom: 25px;
    }

    #last-updated {
      font-size: 20px;
      margin-bottom: 40px;
      text-align: left;
      width: 80%;
      margin: 0 auto;
    }

    #captions {
      white-space: pre-wrap;
      text-align: left;
      font-size: 25px;
      width: 20%;
      margin: 0 auto;
      padding: 10px;
      border: 2px solid black;
      box-sizing: border-box;
}
    }

    @media (max-width: 600px) {
      .banner {
        gap: 12px;
        padding: 15px;
      }

      .banner-title {
        font-size: 17px;
      }

      .back-arrow {
        font-size: 28px;
      }

    }
  </style>
</head>

<body>

  <!-- Top banner -->
  <header class="banner">
    <a href="index.html" class="back-arrow" aria-label="Back to home">
      ←
    </a>

    <a href="index.html" class="banner-title">
      A ROOM WITH A PROJECT ON THE WALL
    </a>
  </header>

  <!-- Captions page content -->
  <main class="content">
    <h1>CAPTIONS_LIVE</h1>
    <h2>(an image of a poem in the language of a poem)</h2>

    <p id="last-updated">Last updated: loading...</p>

    <div id="captions"></div>

  </main>

  <script>
    const url =
      "https://raw.githubusercontent.com/annamackenzie29-hue/wearable_data/main/";

    async function updateCaptions() {
      try {
        const timeResponse = await fetch(
          url + "last_updated.txt?t=" + Date.now()
        );

        if (!timeResponse.ok) {
          throw new Error("Could not load timestamp");
        }

        const time = await timeResponse.text();
        const updated = document.getElementById("last-updated");

        if (time.trim() === updated.dataset.time) {
          return;
        }

        const captionsResponse = await fetch(
          url + "output.txt?t=" + Date.now()
        );

        if (!captionsResponse.ok) {
          throw new Error("Could not load captions");
        }

        const captions = await captionsResponse.text();

        document.getElementById("captions").textContent = captions;
        updated.textContent = "Last updated: " + time.trim();
        updated.dataset.time = time.trim();

      } catch (error) {
        console.error("Error updating captions:", error);
      }
    }

    updateCaptions();
    setInterval(updateCaptions, 60000);
  </script>

</body>
</html>
